# MoveIt controller manager config -- extends the upstream
# moveit_resources_panda_moveit_config/config/moveit_controllers.yaml with a
# second controller entry for the hand, so MoveIt can execute gripper
# open/close goals through the same ros2_control setup
# (see panda_ros2_controllers.yaml) as the arm.
#
# Controller names here MUST match the controller_manager names in
# panda_ros2_controllers.yaml, since MoveItSimpleControllerManager builds
# each action name as <controller_name>/<action_ns>.

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller
    - panda_hand_controller

panda_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

panda_hand_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - panda_finger_joint1
