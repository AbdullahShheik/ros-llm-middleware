# ros2_control controller_manager config, loaded by the gz_ros2_control
# plugin embedded in models/panda/model.sdf.
#
# panda_arm_controller and panda_hand_controller both use
# joint_trajectory_controller/JointTrajectoryController (rather than
# GripperActionController for the hand) because the two finger joints in
# model.sdf are independent prismatic joints with no <mimic> relationship --
# a plain FollowJointTrajectory goal driving both joints together is the
# simplest correct way to open/close them in lockstep, and it matches how
# actuator_node.py already drives the "hand" MoveIt group generically via
# plan()/execute() with no controller-type-specific logic.

controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

panda_hand_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true