# ros2_control controller_manager config, loaded by the gz_ros2_control
# plugin embedded in models/panda/model.sdf.
#
# panda_arm_controller uses JointTrajectoryController for the 7 arm joints.
# robotiq_gripper_controller uses GripperActionController which accepts
# control_msgs/GripperCommand actions — open (0.0) / close (0.8) on the
# single actuated knuckle joint (robotiq_85_left_knuckle_joint).
#
# The right knuckle joint (robotiq_85_right_knuckle_joint) is NOT a
# physics-engine mimic joint here — dartsim doesn't support mimic
# constraints, and gz_ros2_control's own <param name="mimic"> setting
# just wires through to that same physics-engine-level constraint, so
# it doesn't work under dartsim either. Instead, right_knuckle_controller
# gives it its own independent position command interface, and an
# external ROS 2 node mirrors robotiq_85_left_knuckle_joint's position
# onto it in software (position * -1, matching the URDF's mimic
# multiplier) every cycle.

controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    right_knuckle_controller:
      type: forward_command_controller/ForwardCommandController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    initial_positions:
      panda_joint1: 0.0
      panda_joint2: -0.785
      panda_joint3: 0.0
      panda_joint4: -2.356
      panda_joint5: 0.0
      panda_joint6: 1.571
      panda_joint7: 0.785

robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    action_monitor_rate: 20.0
    # A friction grasp on an object stops the knuckle short of the
    # commanded fully-closed position (0.8) -- that stall IS the grasp.
    # With allow_stalling false the action never completes in that case:
    # it keeps commanding effort against the held object indefinitely
    # (shoving it) until the actuator's own 10s client-side wait times out.
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

right_knuckle_controller:
  ros__parameters:
    joints:
      - robotiq_85_right_knuckle_joint
    interface_name: position